<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>SignaCore Public SPA sample</title>
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <h1>SignaCore Public SPA sample</h1>
    <p id="status">Loading.</p>
    <p id="error" role="alert"></p>
    <p>
      <button id="login" type="button" disabled>Sign in</button>
      <button id="userinfo" type="button" disabled>Read UserInfo</button>
      <button id="refresh" type="button" disabled>Refresh tokens</button>
      <button id="logout" type="button" disabled>Sign out of this page</button>
    </p>
    <pre id="claims"></pre>
  </body>
</html>
