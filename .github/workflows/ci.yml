name: CI

# This public-repository workflow only builds and tests on GitHub-hosted runners.
# Production deployment is intentionally separate. Do not add a self-hosted runner job
# that would allow pull-request code to execute on deployment infrastructure.

on:
  push:
    branches: [main]
    tags: ['*.*.*']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Official images come from the AWS public mirror rather than from Docker Hub. Docker Hub meters
# anonymous pulls per client address, and GitHub-hosted runners share their egress addresses with
# every other tenant, so unrelated traffic exhausts the quota and the pull fails with
# "unauthorized: authentication required" for a reason that has nothing to do with the change under
# test. The mirror serves the same official images, needs no credentials, and is not metered that
# way. The database contract tests read this variable too, so the image they request is the image
# the pre-pull step warmed.
env:
  SIGNACORE_POSTGRES_IMAGE: public.ecr.aws/docker/library/postgres:15-alpine

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE_NAME: signacore:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20.19
          cache: npm
          cache-dependency-path: src/SignaCore.Admin/package-lock.json

      - name: Admin frontend
        working-directory: src/SignaCore.Admin
        run: |
          npm ci

          # `npm audit` exits 1 both for a real advisory and for a registry-side failure, and the
          # advisory endpoint it calls is being retired and intermittently answers 400 with a
          # misleading "Invalid package tree" message. Retry only on the transport signature, so a
          # genuine high-severity finding still fails the build on the first attempt.
          for attempt in 1 2 3; do
            if audit_output=$(npm audit --audit-level=high 2>&1); then
              printf '%s\n' "$audit_output"
              break
            fi
            printf '%s\n' "$audit_output"
            if ! printf '%s' "$audit_output" |
              grep -Eq 'audit endpoint returned an error|ECONNRESET|ETIMEDOUT|ENOTFOUND|EAI_AGAIN'; then
              echo "npm audit found advisories at or above high severity." >&2
              exit 1
            fi
            if [ "$attempt" = 3 ]; then
              echo "npm audit could not reach the advisory endpoint after 3 attempts." >&2
              exit 1
            fi
            echo "npm audit hit a transient registry error; retrying in $((attempt * 10))s." >&2
            sleep $((attempt * 10))
          done

          npm run test:coverage
          npm run build

      - name: Build image
        run: bash build.sh

      # Pin the action commit because scanner distribution channels are part of the threat model.
      - name: Scan image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}
          version: v0.73.0
          format: table
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Generate image SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}
          version: v0.73.0
          skip-setup-trivy: true
          format: spdx-json
          output: signacore-image.spdx.json
          scanners: vuln

      - name: Unit tests
        run: |
          dotnet restore tests/SignaCore.Tests/SignaCore.Tests.csproj
          dotnet test tests/SignaCore.Tests/SignaCore.Tests.csproj \
            --configuration Release \
            --coverage \
            --coverage-output signacore-ut.cobertura.xml \
            --coverage-output-format cobertura \
            --coverage-settings tests/coverage.settings.xml \
            --report-xunit-trx \
            --report-xunit-trx-filename signacore-ut.trx \
            --results-directory reports \
            --no-restore
          python .github/scripts/verify_coverage.py \
            reports/signacore-ut.cobertura.xml \
            --minimum-line-rate 0.45 \
            --minimum-branch-rate 0.45

      - name: Integration and HTTP contract tests
        run: |
          dotnet restore tests/SignaCore.IntegrationTests/SignaCore.IntegrationTests.csproj
          dotnet test tests/SignaCore.IntegrationTests/SignaCore.IntegrationTests.csproj \
            --configuration Release \
            --coverage \
            --coverage-output signacore-integration.cobertura.xml \
            --coverage-output-format cobertura \
            --coverage-settings tests/coverage.settings.xml \
            --report-xunit-trx \
            --report-xunit-trx-filename signacore-integration.trx \
            --results-directory reports \
            --no-restore

      - name: Pre-pull PostgreSQL image
        run: .github/scripts/docker-pull.sh "$SIGNACORE_POSTGRES_IMAGE"

      - name: Start PostgreSQL
        run: |
          PG_PASSWORD="$(openssl rand -hex 16)"
          ADMIN_PASSWORD="Aa1$(openssl rand -hex 16)"
          RSA_MASTER_KEY="$(openssl rand -base64 32)"
          APP_ID="signacore-ci-smoke"
          APP_SECRET="$(openssl rand -base64 32)"
          echo "::add-mask::$PG_PASSWORD"
          echo "::add-mask::$ADMIN_PASSWORD"
          echo "::add-mask::$RSA_MASTER_KEY"
          echo "::add-mask::$APP_SECRET"
          {
            echo "PG_PASSWORD=$PG_PASSWORD"
            echo "ADMIN_PASSWORD=$ADMIN_PASSWORD"
            echo "RSA_MASTER_KEY=$RSA_MASTER_KEY"
            echo "APP_ID=$APP_ID"
            echo "APP_SECRET=$APP_SECRET"
          } >> "$GITHUB_ENV"

          mkdir -p "$GITHUB_WORKSPACE/signacore-smoke-data"
          jq -n \
            --arg appId "$APP_ID" \
            --arg appSecret "$APP_SECRET" \
            '{apps:[{appId:$appId,appSecret:$appSecret,appName:"SignaCore CI Smoke",callbackUrl:""}]}' \
            > "$GITHUB_WORKSPACE/signacore-smoke-data/bootstrap-apps.json"

          APP_UID="$(docker run --rm --entrypoint id "$IMAGE_NAME" -u)"
          APP_GID="$(docker run --rm --entrypoint id "$IMAGE_NAME" -g)"
          sudo chown -R "$APP_UID:$APP_GID" "$GITHUB_WORKSPACE/signacore-smoke-data"

          docker network create signacore-smoke
          docker run -d --name signacore-smoke-pg --network signacore-smoke \
            -e POSTGRES_PASSWORD="$PG_PASSWORD" \
            "$SIGNACORE_POSTGRES_IMAGE"

          for i in $(seq 1 30); do
            if docker exec signacore-smoke-pg pg_isready -U postgres -q; then
              echo "PostgreSQL ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "PostgreSQL failed to become ready"
          docker logs signacore-smoke-pg
          exit 1

      - name: Start SignaCore container
        run: |
          # The launcher carries no application secrets any more: the protected bootstrap file holds
          # the database connection and the external root key, and everything else is established by
          # first-run setup.
          mkdir -p "$GITHUB_WORKSPACE/signacore-smoke-config"
          jq -n \
            --arg connectionString "Host=signacore-smoke-pg;Port=5432;Database=signacore;Username=postgres;Password=${PG_PASSWORD}" \
            --arg masterKey "$RSA_MASTER_KEY" \
            '{Database:{Provider:"PostgreSQL",ServerVersion:"15",ConnectionString:$connectionString},MasterKey:$masterKey}' \
            > "$GITHUB_WORKSPACE/signacore-smoke-config/signacore.bootstrap.json"

          APP_UID="$(docker run --rm --entrypoint id "$IMAGE_NAME" -u)"
          APP_GID="$(docker run --rm --entrypoint id "$IMAGE_NAME" -g)"
          sudo chown -R "$APP_UID:$APP_GID" "$GITHUB_WORKSPACE/signacore-smoke-config"
          sudo chmod 700 "$GITHUB_WORKSPACE/signacore-smoke-config"
          sudo chmod 600 "$GITHUB_WORKSPACE/signacore-smoke-config/signacore.bootstrap.json"

          # unless-stopped is what turns "setup completed" into "restarted into the normal host":
          # the setup-mode host stops itself once the setup transaction has committed.
          docker run -d --name signacore-smoke-app --network signacore-smoke -p 5002:5002 \
            --restart unless-stopped \
            -v "$GITHUB_WORKSPACE/signacore-smoke-config:/app/config" \
            -v "$GITHUB_WORKSPACE/signacore-smoke-data:/app/data" \
            -e APP_TITLE='SignaCore CI Smoke' \
            "$IMAGE_NAME"

      - name: Wait for liveness
        run: |
          # A brand-new installation is deliberately live but not ready, so the launcher waits for
          # liveness first; waiting for readiness would make the setup page unreachable forever.
          for i in $(seq 1 90); do
            if curl -fsS --max-time 3 http://localhost:5002/health/live >/dev/null 2>&1; then
              echo "SignaCore live after ${i}s"
              exit 0
            fi
            if [ -z "$(docker ps -q --filter 'name=^/signacore-smoke-app$')" ]; then
              echo 'SignaCore container exited before becoming live'
              docker logs signacore-smoke-app
              exit 1
            fi
            sleep 1
          done
          echo 'Timed out waiting for /health/live'
          docker logs signacore-smoke-app
          exit 1

      - name: Setup Mode assertions
        run: |
          set -euo pipefail
          fail() { echo "SMOKE FAIL: $*"; exit 1; }

          curl -fsS --max-time 10 http://localhost:5002/api/setup/status | grep -q '"status":"pending"' \
            || fail 'a new database did not enter Setup Mode'

          ready_status="$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' \
            http://localhost:5002/health/ready)"
          [ "$ready_status" = '503' ] || fail "/health/ready returned $ready_status while pending"

          token_status="$(curl -sS --max-time 10 -o /tmp/pending.json -w '%{http_code}' \
            -X POST http://localhost:5002/api/auth/token \
            -H 'Content-Type: application/json' -d '{"grantType":"password"}')"
          [ "$token_status" = '503' ] || fail "token endpoint returned $token_status while pending"
          grep -q 'installation_required' /tmp/pending.json \
            || fail "pending token response lacks installation_required: $(cat /tmp/pending.json)"

          redirect="$(curl -sS --max-time 10 -o /dev/null -w '%{redirect_url}' \
            -H 'Accept: text/html' http://localhost:5002/admin)"
          case "$redirect" in
            */setup) ;;
            *) fail "/admin redirected to '$redirect' instead of /setup" ;;
          esac

          echo 'Setup Mode assertions passed'

      - name: Complete first-run setup
        run: |
          set -euo pipefail

          # The plaintext setup code is printed exactly once, to stdout, and is never stored.
          SETUP_CODE="$(docker logs signacore-smoke-app 2>&1 \
            | grep -Eo '[A-Z0-9]{5}(-[A-Z0-9]{5}){5}' | head -1)"
          [ -n "$SETUP_CODE" ] || { echo 'no setup code found in the container log'; exit 1; }
          echo "::add-mask::$SETUP_CODE"

          # A wrong code must be refused without changing anything.
          bad_status="$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' \
            -X POST http://localhost:5002/api/setup/complete \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg password "$ADMIN_PASSWORD" \
              '{publicBaseUrl:"https://signacore.test",username:"smoke_admin",password:$password,confirmPassword:$password,setupCode:"AAAAA-BBBBB-CCCCC-DDDDD"}')")"
          [ "$bad_status" = '403' ] || { echo "wrong setup code returned $bad_status"; exit 1; }

          status="$(curl -sS --max-time 10 -o /tmp/setup.json -w '%{http_code}' \
            -X POST http://localhost:5002/api/setup/complete \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg password "$ADMIN_PASSWORD" --arg code "$SETUP_CODE" \
              '{publicBaseUrl:"https://signacore.test",username:"smoke_admin",password:$password,confirmPassword:$password,setupCode:$code}')")"
          [ "$status" = '200' ] || { echo "setup returned $status: $(cat /tmp/setup.json)"; exit 1; }

      - name: Wait for readiness after the restart
        run: |
          # The host stops itself after the response completes; Docker's restart policy brings it
          # back as the normal host.
          for i in $(seq 1 120); do
            if [ "$(curl -fsS --max-time 3 http://localhost:5002/health/ready 2>/dev/null)" = 'Healthy' ]; then
              echo "SignaCore ready after ${i}s"
              # /health remains a compatibility alias for readiness.
              [ "$(curl -fsS --max-time 3 http://localhost:5002/health)" = 'Healthy' ] \
                || { echo '/health is not an alias for readiness'; exit 1; }
              exit 0
            fi
            sleep 1
          done
          echo 'Timed out waiting for /health/ready after setup'
          docker logs --tail 200 signacore-smoke-app
          exit 1

      - name: Setup cannot be replayed
        run: |
          set -euo pipefail

          curl -fsS --max-time 10 http://localhost:5002/api/setup/status | grep -q '"status":"completed"' \
            || { echo 'setup status did not become completed'; exit 1; }

          status="$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' \
            -X POST http://localhost:5002/api/setup/complete \
            -H 'Content-Type: application/json' \
            -d '{"publicBaseUrl":"https://attacker.test","username":"attacker","password":"Attacker1234","confirmPassword":"Attacker1234","setupCode":"AAAAA-BBBBB-CCCCC-DDDDD"}')"
          [ "$status" = '409' ] || { echo "completed installation accepted setup: $status"; exit 1; }

      - name: Smoke assertions
        run: |
          set -euo pipefail
          fail() { echo "SMOKE FAIL: $*"; exit 1; }

          jwks="$(curl -fsS --max-time 10 http://localhost:5002/.well-known/jwks)"
          echo "$jwks" | grep -q '"kty":"RSA"' || fail "JWKS has no RSA key: $jwks"
          echo "$jwks" | grep -q '"alg":"RS256"' || fail "JWKS has no RS256 key: $jwks"

          # The .json alias is what operators and hand-configured validators reach for; a 404 there
          # reads as "no keys published". It must serve the same document as the canonical route.
          jwks_alias="$(curl -fsS --max-time 10 http://localhost:5002/.well-known/jwks.json)" \
            || fail "/.well-known/jwks.json did not answer"
          [ "$jwks_alias" = "$jwks" ] || fail "JWKS alias diverged from /.well-known/jwks"

          status="$(curl -sS --max-time 10 -o /tmp/token.json -w '%{http_code}' \
            -X POST http://localhost:5002/api/auth/token \
            -H 'Content-Type: application/json' \
            -H "X-Admin-AppId: ${APP_ID}" \
            -H "X-Admin-AppSecret: ${APP_SECRET}" \
            -d '{"grantType":"no_such_grant"}')"
          [ "$status" = '200' ] || fail "token endpoint returned $status; contract requires 200"
          grep -q 'unsupported_grant_type' /tmp/token.json \
            || fail "token response lacks unsupported_grant_type: $(cat /tmp/token.json)"

          index="$(curl -fsS --max-time 10 http://localhost:5002/)"
          echo "$index" | grep -q '<div id="app">' || fail 'SPA root is not the Vue artifact'
          echo "$index" | grep -q '<title>SignaCore CI Smoke</title>' \
            || fail 'APP_TITLE was not injected into <title>'
          echo "$index" | grep -q "window.__APP_TITLE__ = 'SignaCore CI Smoke'" \
            || fail 'window.__APP_TITLE__ was not injected'
          if echo "$index" | grep -q '<title>__APP_TITLE__</title>'; then
            fail '<title> still contains the __APP_TITLE__ placeholder'
          fi

          metrics_status="$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' \
            http://localhost:5002/metrics)"
          case "$metrics_status" in
            2*) ;;
            *) fail "/metrics returned $metrics_status" ;;
          esac

          applied="$(docker exec -e PGPASSWORD="$PG_PASSWORD" signacore-smoke-pg \
            psql -U postgres -d signacore -tAc \
            'SELECT count(*) FROM "__EFMigrationsHistory"')"
          [ "$applied" -gt 0 ] || fail '__EFMigrationsHistory is empty; migrations did not run'
          echo "applied migrations: $applied"

          echo 'All smoke assertions passed'

      - name: Token issuance end-to-end
        run: |
          set -euo pipefail

          status="$(curl -sS --max-time 10 -o /tmp/issued.json -w '%{http_code}' \
            -X POST http://localhost:5002/api/auth/token \
            -H 'Content-Type: application/json' \
            -H "X-Admin-AppId: ${APP_ID}" \
            -H "X-Admin-AppSecret: ${APP_SECRET}" \
            -d "{\"grantType\":\"password\",\"username\":\"smoke_admin\",\"password\":\"${ADMIN_PASSWORD}\"}")"
          [ "$status" = '200' ] || { echo "token endpoint returned $status; contract requires 200"; exit 1; }

          python3 - <<'PY'
          import json, sys
          body = json.load(open('/tmp/issued.json'))
          if not body.get('success'):
              sys.exit(f"password grant failed: {body.get('message')}")
          token = body.get('accessToken') or ''
          if not token:
              sys.exit('response has no accessToken')
          refresh_token = body.get('refreshToken') or ''
          if not refresh_token:
              sys.exit('response has no refreshToken')
          open('/tmp/access_token', 'w').write(token)
          open('/tmp/refresh_token', 'w').write(refresh_token)
          PY

          curl -fsS --max-time 10 http://localhost:5002/.well-known/jwks -o /tmp/jwks.json
          python3 .github/scripts/verify_jwt.py /tmp/access_token /tmp/jwks.json \
            'https://signacore.test' 'SignaCore.Services'

          status="$(curl -sS --max-time 10 -o /tmp/profile.json -w '%{http_code}' \
            -H "Authorization: Bearer $(cat /tmp/access_token)" \
            http://localhost:5002/api/profile/me)"
          [ "$status" = '200' ] || {
            echo "/api/profile/me returned $status (expected 200)"; cat /tmp/profile.json; exit 1;
          }

          python3 - <<'PY'
          import base64, json, sys
          def b64u(value):
              return base64.urlsafe_b64decode(value + '=' * (-len(value) % 4))
          subject = json.loads(b64u(open('/tmp/access_token').read().split('.')[1]))['sub']
          user_id = json.load(open('/tmp/profile.json'))['userId']
          if subject != user_id:
              sys.exit('/api/profile/me user id does not match the token subject')
          print('self-consumption OK: MapInboundClaims restored sub as the account identity')
          PY

          status="$(curl -sS --max-time 10 -o /tmp/refreshed.json -w '%{http_code}' \
            -X POST http://localhost:5002/api/auth/token \
            -H 'Content-Type: application/json' \
            -H "X-Admin-AppId: ${APP_ID}" \
            -H "X-Admin-AppSecret: ${APP_SECRET}" \
            -d "$(jq -n --rawfile token /tmp/refresh_token \
              '{grantType:"refresh_token",refreshToken:$token}')")"
          [ "$status" = '200' ] || { echo "refresh endpoint returned $status"; exit 1; }

          python3 - <<'PY'
          import json, sys
          original = open('/tmp/refresh_token').read()
          body = json.load(open('/tmp/refreshed.json'))
          if not body.get('success'):
              sys.exit(f"refresh rotation failed: {body.get('message')}")
          replacement = body.get('refreshToken') or ''
          if not replacement or replacement == original:
              sys.exit('refresh rotation did not issue a distinct replacement')
          PY

          status="$(curl -sS --max-time 10 -o /tmp/replayed.json -w '%{http_code}' \
            -X POST http://localhost:5002/api/auth/token \
            -H 'Content-Type: application/json' \
            -H "X-Admin-AppId: ${APP_ID}" \
            -H "X-Admin-AppSecret: ${APP_SECRET}" \
            -d "$(jq -n --rawfile token /tmp/refresh_token \
              '{grantType:"refresh_token",refreshToken:$token}')")"
          [ "$status" = '200' ] || { echo "refresh replay returned $status"; exit 1; }
          jq -e '.success == false' /tmp/replayed.json >/dev/null \
            || { echo 'consumed refresh token replay was accepted'; exit 1; }

          unprotected="$(docker exec -e PGPASSWORD="$PG_PASSWORD" signacore-smoke-pg \
            psql -U postgres -d signacore -tAc \
            "SELECT count(*) FROM refresh_tokens WHERE token_value NOT LIKE 'sha256:%'")"
          [ "$unprotected" = '0' ] \
            || { echo "database contains $unprotected unprotected refresh tokens"; exit 1; }
          protected="$(docker exec -e PGPASSWORD="$PG_PASSWORD" signacore-smoke-pg \
            psql -U postgres -d signacore -tAc \
            "SELECT count(*) FROM refresh_tokens WHERE token_value LIKE 'sha256:%' AND length(token_value) = 71")"
          [ "$protected" -ge 2 ] \
            || { echo "expected rotated refresh-token digests, found $protected"; exit 1; }

      - name: Dump container logs
        if: failure()
        run: |
          echo "::group::SignaCore container logs"
          docker logs signacore-smoke-app 2>&1 | tail -300 || true
          echo "::endgroup::"
          echo "::group::postgres logs"
          docker logs signacore-smoke-pg 2>&1 | tail -50 || true
          echo "::endgroup::"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unit-test-results
          path: reports/
          if-no-files-found: ignore

      - name: Upload image SBOM
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: signacore-image-sbom
          path: signacore-image.spdx.json
          if-no-files-found: ignore

  database-contracts:
    name: Database Contract Matrix
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUN_SIGNACORE_DATABASE_CONTRACTS: 'true'
      TESTCONTAINERS_RYUK_DISABLED: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Pre-pull database images
        run: |
          .github/scripts/docker-pull.sh "$SIGNACORE_POSTGRES_IMAGE"
          docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}'

      - name: Database contract matrix
        run: |
          dotnet restore tests/SignaCore.IntegrationTests/SignaCore.IntegrationTests.csproj
          dotnet test tests/SignaCore.IntegrationTests/SignaCore.IntegrationTests.csproj \
            --configuration Release \
            --filter 'FullyQualifiedName~DatabaseContractTests' \
            --report-xunit-trx \
            --report-xunit-trx-filename signacore-database-contracts.trx \
            --output Detailed \
            --results-directory reports \
            --hangdump \
            --hangdump-timeout 5m \
            --no-restore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: database-contract-results
          path: reports/
          if-no-files-found: ignore

  # Runs for release tags and for default-branch pushes. A default-branch push publishes only the
  # moving `edge` tag; `latest` and the semver tags stay tag-only, gated below.
  publish-container:
    name: Publish GHCR Image
    if: >-
      github.event_name == 'push' &&
      (startsWith(github.ref, 'refs/tags/') ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    needs: [build-test, database-contracts]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY_IMAGE: ghcr.io/philfanzhou/signacore
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "Release tag must use MAJOR.MINOR.PATCH or MAJOR.MINOR.PATCH-rc.NUMBER." >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          # The default `latest=auto` adds its own `latest` for every semver match, on top of the
          # explicitly gated row below, and the action does not de-duplicate the two. Turning the
          # flavour off leaves that gate as the only source of `latest`.
          flavor: latest=false
          tags: |
            # Only produced on a default-branch push. The tag moves rather than accumulating, but
            # each push leaves the previous manifest, with its provenance and SBOM attestations,
            # behind as an untagged package version, which GHCR does not prune on its own.
            type=edge,branch=${{ github.event.repository.default_branch }}
            # The semver rules read the tag name and yield nothing on a branch ref.
            # A pre-release gets only its exact immutable version. Stable releases additionally
            # move the minor channel and latest; an RC must never replace either production tag.
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') }}
            # Release tags carry no `v` prefix here, so the gate must not require one. Without
            # this gate the rule is unconditional and the first default-branch push would move
            # `latest` onto a development build.
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') }}

      - name: Build and publish image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: src/SignaCore.Host/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=signacore-release
          cache-to: type=gha,mode=max,scope=signacore-release
          provenance: mode=max
          sbom: true

      - name: Record published image
        env:
          META_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Published container"
            echo
            echo "- Digest: \`${{ steps.push.outputs.digest }}\`"
            echo "- Tags:"
            # `continue` rather than a trailing `&&`: the last command of the loop body sets the
            # status of the loop, the group, and the step, so a blank final line would fail the
            # step after the image is already pushed.
            while IFS= read -r image_tag; do
              [ -n "$image_tag" ] || continue
              printf '  - `%s`\n' "$image_tag"
            done <<< "${META_TAGS}"
          } >> "$GITHUB_STEP_SUMMARY"

  # Runs last so a release only ever exists for a tag whose tests passed and whose image is
  # actually pullable, and so the notes can quote the digest that was really published.
  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [publish-container]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      REGISTRY_IMAGE: ghcr.io/philfanzhou/signacore
      IMAGE_DIGEST: ${{ needs.publish-container.outputs.digest }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Publish the release
        shell: bash
        run: |
          set -euo pipefail

          # Re-running the workflow for a tag must not rewrite notes someone has since edited by
          # hand, so an existing release is left exactly as it is.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; leaving it untouched."
            echo "Release \`${GITHUB_REF_NAME}\` already existed and was left untouched." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            release_flags=(--prerelease)
            channel_note="Pre-release image; the stable minor channel and latest tag were not changed."
          else
            minor="${GITHUB_REF_NAME%.*}"
            release_flags=(--latest)
            channel_note="Also tagged ${minor} and latest."
          fi

          # printf keeps the Markdown backticks literal; a heredoc would need them escaped.
          {
            printf '## Container image\n\n'
            printf '```\n%s:%s\n```\n\n' "${REGISTRY_IMAGE}" "${GITHUB_REF_NAME}"
            printf 'Digest: `%s`\n\n' "${IMAGE_DIGEST}"
            printf '%s\n' "${channel_note}"
          } > release-notes.md

          # --generate-notes appends GitHub's commit and pull-request changelog underneath.
          gh release create "${GITHUB_REF_NAME}" \
            --title "SignaCore ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --generate-notes \
            --verify-tag \
            "${release_flags[@]}"

          {
            echo "### Published release"
            echo
            echo "- <${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}>"
          } >> "$GITHUB_STEP_SUMMARY"
