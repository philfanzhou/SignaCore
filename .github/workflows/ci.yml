name: CI

# This public-repository workflow only builds and tests on GitHub-hosted runners.
# Production deployment is intentionally separate. Do not add a self-hosted runner job
# that would allow pull-request code to execute on deployment infrastructure.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE_NAME: signacore:ci
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version: 20.19
          cache: npm
          cache-dependency-path: src/SignaCore.Admin/package-lock.json

      - name: Admin frontend
        working-directory: src/SignaCore.Admin
        run: |
          npm ci
          npm audit --audit-level=high
          npm run build

      - name: Build image
        run: bash build.sh

      - name: Unit tests
        run: |
          dotnet restore tests/SignaCore.Tests/SignaCore.Tests.csproj
          dotnet test tests/SignaCore.Tests/SignaCore.Tests.csproj \
            --configuration Release \
            --logger 'trx;logfilename=signacore-ut.trx' \
            --results-directory reports \
            --no-restore

      - name: HTTP endpoint contract tests
        run: |
          dotnet restore tests/SignaCore.IntegrationTests/SignaCore.IntegrationTests.csproj
          dotnet test tests/SignaCore.IntegrationTests/SignaCore.IntegrationTests.csproj \
            --configuration Release \
            --filter 'FullyQualifiedName~IdentityHttpEndpointsTests' \
            --logger 'trx;logfilename=signacore-http-endpoints.trx' \
            --results-directory reports \
            --no-restore

      - name: Pre-pull PostgreSQL image
        run: |
          echo "::group::docker pull postgres:15-alpine"
          time docker pull postgres:15-alpine
          echo "::endgroup::"

      - name: Start PostgreSQL
        run: |
          PG_PASSWORD="$(openssl rand -hex 16)"
          ADMIN_PASSWORD="Aa1$(openssl rand -hex 16)"
          RSA_MASTER_KEY="$(openssl rand -base64 32)"
          APP_ID="signacore-ci-smoke"
          APP_SECRET="$(openssl rand -base64 32)"
          echo "::add-mask::$PG_PASSWORD"
          echo "::add-mask::$ADMIN_PASSWORD"
          echo "::add-mask::$RSA_MASTER_KEY"
          echo "::add-mask::$APP_SECRET"
          {
            echo "PG_PASSWORD=$PG_PASSWORD"
            echo "ADMIN_PASSWORD=$ADMIN_PASSWORD"
            echo "RSA_MASTER_KEY=$RSA_MASTER_KEY"
            echo "APP_ID=$APP_ID"
            echo "APP_SECRET=$APP_SECRET"
          } >> "$GITHUB_ENV"

          mkdir -p "$GITHUB_WORKSPACE/signacore-smoke-data"
          jq -n \
            --arg appId "$APP_ID" \
            --arg appSecret "$APP_SECRET" \
            '{apps:[{appId:$appId,appSecret:$appSecret,appName:"SignaCore CI Smoke",callbackUrl:""}]}' \
            > "$GITHUB_WORKSPACE/signacore-smoke-data/bootstrap-apps.json"

          APP_UID="$(docker run --rm --entrypoint id "$IMAGE_NAME" -u)"
          APP_GID="$(docker run --rm --entrypoint id "$IMAGE_NAME" -g)"
          sudo chown -R "$APP_UID:$APP_GID" "$GITHUB_WORKSPACE/signacore-smoke-data"

          docker network create signacore-smoke
          docker run -d --name signacore-smoke-pg --network signacore-smoke \
            -e POSTGRES_PASSWORD="$PG_PASSWORD" \
            postgres:15-alpine

          for i in $(seq 1 30); do
            if docker exec signacore-smoke-pg pg_isready -U postgres -q; then
              echo "PostgreSQL ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "PostgreSQL failed to become ready"
          docker logs signacore-smoke-pg
          exit 1

      - name: Start SignaCore container
        run: |
          docker run -d --name signacore-smoke-app --network signacore-smoke -p 5002:5002 \
            -v "$GITHUB_WORKSPACE/signacore-smoke-data:/app/data" \
            -e APP_TITLE='SignaCore CI Smoke' \
            -e Database__Provider=PostgreSQL \
            -e Database__ServerVersion=15 \
            -e Database__ConnectionString="Host=signacore-smoke-pg;Port=5432;Database=signacore;Username=postgres;Password=${PG_PASSWORD}" \
            -e ADMIN_BOOTSTRAP_USERNAME=smoke_admin \
            -e ADMIN_BOOTSTRAP_PASSWORD="${ADMIN_PASSWORD}" \
            -e RSA_MASTER_KEY="${RSA_MASTER_KEY}" \
            -e CONSUL_HTTP_ADDR=127.0.0.1:8500 \
            -e Consul__Discovery__Register=false \
            -e Consul__Discovery__Deregister=false \
            -e Loki__Uri=http://127.0.0.1:3100 \
            "$IMAGE_NAME"

      - name: Wait for /health
        run: |
          for i in $(seq 1 90); do
            if [ "$(curl -fsS --max-time 3 http://localhost:5002/health 2>/dev/null)" = 'Healthy' ]; then
              echo "SignaCore healthy after ${i}s"
              exit 0
            fi
            if [ -z "$(docker ps -q --filter 'name=^/signacore-smoke-app$')" ]; then
              echo 'SignaCore container exited before becoming healthy'
              exit 1
            fi
            sleep 1
          done
          echo 'Timed out waiting for /health'
          exit 1

      - name: Smoke assertions
        run: |
          set -euo pipefail
          fail() { echo "SMOKE FAIL: $*"; exit 1; }

          jwks="$(curl -fsS --max-time 10 http://localhost:5002/.well-known/jwks)"
          echo "$jwks" | grep -q '"kty":"RSA"' || fail "JWKS has no RSA key: $jwks"
          echo "$jwks" | grep -q '"alg":"RS256"' || fail "JWKS has no RS256 key: $jwks"

          status="$(curl -sS --max-time 10 -o /tmp/token.json -w '%{http_code}' \
            -X POST http://localhost:5002/api/auth/token \
            -H 'Content-Type: application/json' \
            -H "X-Admin-AppId: ${APP_ID}" \
            -H "X-Admin-AppSecret: ${APP_SECRET}" \
            -d '{"grantType":"no_such_grant"}')"
          [ "$status" = '200' ] || fail "token endpoint returned $status; contract requires 200"
          grep -q 'unsupported_grant_type' /tmp/token.json \
            || fail "token response lacks unsupported_grant_type: $(cat /tmp/token.json)"

          index="$(curl -fsS --max-time 10 http://localhost:5002/)"
          echo "$index" | grep -q '<div id="app">' || fail 'SPA root is not the Vue artifact'
          echo "$index" | grep -q '<title>SignaCore CI Smoke</title>' \
            || fail 'APP_TITLE was not injected into <title>'
          echo "$index" | grep -q "window.__APP_TITLE__ = 'SignaCore CI Smoke'" \
            || fail 'window.__APP_TITLE__ was not injected'
          if echo "$index" | grep -q '<title>__APP_TITLE__</title>'; then
            fail '<title> still contains the __APP_TITLE__ placeholder'
          fi

          metrics_status="$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' \
            http://localhost:5002/metrics)"
          case "$metrics_status" in
            2*) ;;
            *) fail "/metrics returned $metrics_status" ;;
          esac

          applied="$(docker exec -e PGPASSWORD="$PG_PASSWORD" signacore-smoke-pg \
            psql -U postgres -d signacore -tAc \
            'SELECT count(*) FROM "__EFMigrationsHistory"')"
          [ "$applied" -gt 0 ] || fail '__EFMigrationsHistory is empty; migrations did not run'
          echo "applied migrations: $applied"

          echo 'All smoke assertions passed'

      - name: Token issuance end-to-end
        run: |
          set -euo pipefail

          status="$(curl -sS --max-time 10 -o /tmp/issued.json -w '%{http_code}' \
            -X POST http://localhost:5002/api/auth/token \
            -H 'Content-Type: application/json' \
            -H "X-Admin-AppId: ${APP_ID}" \
            -H "X-Admin-AppSecret: ${APP_SECRET}" \
            -d "{\"grantType\":\"password\",\"username\":\"smoke_admin\",\"password\":\"${ADMIN_PASSWORD}\"}")"
          [ "$status" = '200' ] || { echo "token endpoint returned $status; contract requires 200"; exit 1; }

          python3 - <<'PY'
          import json, sys
          body = json.load(open('/tmp/issued.json'))
          if not body.get('success'):
              sys.exit(f"password grant failed: {body.get('message')}")
          token = body.get('accessToken') or ''
          if not token:
              sys.exit('response has no accessToken')
          open('/tmp/access_token', 'w').write(token)
          PY

          curl -fsS --max-time 10 http://localhost:5002/.well-known/jwks -o /tmp/jwks.json
          python3 .github/scripts/verify_jwt.py /tmp/access_token /tmp/jwks.json \
            'SignaCore' 'SignaCore.Services'

          status="$(curl -sS --max-time 10 -o /tmp/profile.json -w '%{http_code}' \
            -H "Authorization: Bearer $(cat /tmp/access_token)" \
            http://localhost:5002/api/profile/me)"
          [ "$status" = '200' ] || {
            echo "/api/profile/me returned $status (expected 200)"; cat /tmp/profile.json; exit 1;
          }

          python3 - <<'PY'
          import base64, json, sys
          def b64u(value):
              return base64.urlsafe_b64decode(value + '=' * (-len(value) % 4))
          subject = json.loads(b64u(open('/tmp/access_token').read().split('.')[1]))['sub']
          user_id = json.load(open('/tmp/profile.json'))['userId']
          if subject != user_id:
              sys.exit('/api/profile/me user id does not match the token subject')
          print('self-consumption OK: MapInboundClaims restored sub as the account identity')
          PY

      - name: Dump container logs
        if: failure()
        run: |
          echo "::group::SignaCore container logs"
          docker logs signacore-smoke-app 2>&1 | tail -300 || true
          echo "::endgroup::"
          echo "::group::postgres logs"
          docker logs signacore-smoke-pg 2>&1 | tail -50 || true
          echo "::endgroup::"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: reports/
          if-no-files-found: ignore

  database-contracts:
    name: Database Contract Matrix
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUN_SIGNACORE_DATABASE_CONTRACTS: 'true'
      TESTCONTAINERS_RYUK_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Pre-pull database images
        run: |
          for image in postgres:15-alpine mysql:8.4 mariadb:11.4; do
            echo "::group::docker pull $image"
            time docker pull "$image"
            echo "::endgroup::"
          done
          docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}'

      - name: Database contract matrix
        run: |
          dotnet restore tests/SignaCore.IntegrationTests/SignaCore.IntegrationTests.csproj
          dotnet test tests/SignaCore.IntegrationTests/SignaCore.IntegrationTests.csproj \
            --configuration Release \
            --filter 'FullyQualifiedName~DatabaseContractTests' \
            --logger 'trx;logfilename=signacore-database-contracts.trx' \
            --logger 'console;verbosity=normal' \
            --results-directory reports \
            --blame-hang \
            --blame-hang-timeout 5m \
            --no-restore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: database-contract-results
          path: reports/
          if-no-files-found: ignore
